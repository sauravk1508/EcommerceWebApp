<script>
	// Change navbar background on scroll
	window.addEventListener('scroll', function() {
		const navbar = document.querySelector('.navbar');
		if (window.scrollY > 50) {
			navbar.classList.add('scrolled');
		} else {
			navbar.classList.remove('scrolled');
		}
	});
	document.addEventListener('DOMContentLoaded', function() {
	    document.querySelectorAll('.dropend > .dropdown-toggle').forEach(function(toggle) {
	        toggle.addEventListener('click', function(e) {
	            e.preventDefault();
	            e.stopPropagation();
	            
	            var menu = this.nextElementSibling;
	            var isOpen = menu.classList.contains('show');
	            
	            // Close all nested dropdowns
	            document.querySelectorAll('.dropend .dropdown-menu').forEach(function(m) {
	                m.classList.remove('show');
	            });
	            
	            // Toggle current one
	            if (!isOpen) {
	                menu.classList.add('show');
	            }
	        });
	    });
	});
</script>

    position: absolute;

}

.dropend > .dropdown-toggle::after {
    border-left: 0.3em solid;
    border-right: 0;
    border-bottom: 0.3em solid transparent;
    border-top: 0.3em solid transparent;
    vertical-align: 0;
    margin-left: 0.5em;
}

@media (min-width: 992px) {
    .navbar-collapse .dropend .dropdown-menu {
        position: absolute;
        top: 0;
        left: 100%;
        margin-left: 0.125rem;
        margin-top: 0;
    }

    .navbar-collapse .dropend > .dropdown-toggle::after {
        border-left: 0.3em solid;

        border-bottom: 0.3em solid transparent;
        border-top: 0.3em solid transparent;
        vertical-align: 0;
        margin-left: 0.5em;
    }
}

/* Mobile/Tablet - Inner dropdowns open downward (when navbar is collapsed) */
@media (max-width: 991px) {
    .navbar-collapse .dropend .dropdown-menu {
        position: static;
        margin-left: 1.5rem;
        margin-top: 0.25rem;
    }

    .navbar-collapse .dropend > .dropdown-toggle::after {
        border-top: 0.3em solid;
        border-right: 0.3em solid transparent;
        border-bottom: 0;

}
