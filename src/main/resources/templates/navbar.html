<nav class="navbar navbar-expand-lg navbar-light bg-secondary">
	<div class="container-fluid">
		<a class="navbar-brand" th:href="@{/admin/products}"
			style="font-weight: bold; color: white;">E-Commerce</a>
		
		<div class="collapse navbar-collapse" id="navbarSupportedContent">
			<!-- Left-aligned Links -->
			<ul class="navbar-nav me-auto mb-2 mb-lg-0">
				<li class="nav-item"><a class="nav-link active"
					aria-current="page" th:href="@{/admin/products}">Home</a></li>

					th:href="@{/admin/products/add}">Add Product</a></li>
				<li class="nav-item dropdown"><a
					class="nav-link dropdown-toggle" href="#" role="button"
					data-bs-toggle="dropdown" aria-expanded="false"> Categories </a>
					<ul class="dropdown-menu">
						<li><a class="dropdown-item" th:href="@{/admin/products}">All</a>
						</li>
						<li th:each="category : ${categories}"><a
							class="dropdown-item"
							th:href="@{/admin/products/category/{categoryName}(categoryName=${category})}"
							th:text="${category}"></a></li>
					</ul></li>
			</ul>
			<!-- Cart Icon (Outside the collapse div) -->
		<div class="cart-icon me-3">
			<a class="nav-link" th:href="@{/cart/view}"> <img
				th:src="@{/images/cart.png}" alt="Cart"
				style="width: 30px; height: 30px;" />
			</a>
		</div>
			
		</div>

		<!-- Centered Search Form (Outside the collapse div) -->
		<form action="/admin/products/search" class="d-flex me-3"
			role="search">
			<input class="form-control me-2" type="search"
				placeholder="Search products..." aria-label="Search" name="keyword">
			<button class="btn btn-outline-light" type="submit">Search</button>

		<!-- Right-aligned User Info and Logout Dropdown -->
		<div class="dropdown">
			<button class="btn btn-info dropdown-toggle" type="button"
				id="dropdownMenuButton" data-bs-toggle="dropdown"
				aria-expanded="false">

			</button>

</nav>



<script>
	// Change navbar background on scroll
	window.addEventListener('scroll', function() {
		const navbar = document.querySelector('.navbar');
		if (window.scrollY > 50) {
			navbar.classList.add('scrolled');
		} else {
			navbar.classList.remove('scrolled');
		}
	});
</script>
