<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Admin - Product Upload</title>
    <link rel="stylesheet" th:href="@{/css/productUpload.css}" />
    <script src="/dwr/engine.js"></script>
    <script src="/dwr/util.js"></script>
    <script src="/dwr/interface/adminController.js"></script>
    <div th:insert="~{allcss.html}"></div>

</head>
<body>
<div class="upload-container">
    <h2 class="text-center mb-4"><i class="fas fa-file-excel me-2" style="color: #1d6f42;"></i>Excel File Upload</h2>

    <div class="upload-area" id="uploadArea">
        <i class="fas fa-cloud-upload-alt upload-icon"></i>
        <h5>Drag & Drop your Excel file here</h5>
        <p class="text-muted">or click to browse</p>
        <p class="text-muted small">Supported formats: .xls, .xlsx</p>
        <input type="file" id="fileInput" class="file-input" accept=".xls,.xlsx">
    </div>

    <div id="fileInfo" class="file-info" style="display: none;">
        <div class="d-flex justify-content-between align-items-center">
            <div>
                <div class="file-name"><i class="fas fa-file-excel me-2"></i><span id="fileName"></span></div>
                <div class="file-size" id="fileSize"></div>
            </div>
            <button class="btn btn-sm btn-danger" id="removeFile">
                <i class="fas fa-times"></i>
            </button>
        </div>
    </div>

    <div class="text-center">
        <button class="btn btn-primary btn-upload" id="uploadBtn" disabled>
            <i class="fas fa-upload me-2"></i>Upload File
        </button>
    </div>
</div>
<script th:src="@{/js/productUpload.js}"></script>
</body>
</html>
