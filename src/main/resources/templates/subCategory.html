<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Admin - Add/Edit Product Sub Category</title>
    <script src="/dwr/engine.js"></script>
    <script src="/dwr/util.js"></script>
    <script src="/dwr/interface/adminController.js"></script>
    <script th:src="@{/js/subCategory.js}"></script>
</head>
<body>
	<div th:insert="~{allcss.html}"></div>
	<div class="container mt-5">
        <h2 class="text-center" th:text="${prodSubCategory.id != null} ? 'Edit Product Category' : 'Add Product Category'"></h2>
             <input type="hidden" th:field="*{prodSubCategory.id}" /> 
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="name" class="form-label">Name:</label>
                    <input type="text" id ="subCategoryName" class="form-control" th:field="*{prodSubCategory.name}" placeholder="Category Name" required />
                </div>
                <div class="col-md-6">
                    <label for="description" class="form-label">Description:</label>
                    <input type="text" id = "subCategoryDesc" class="form-control" th:field="*{prodSubCategory.description}" placeholder="Add Category Description" required />
                </div>
                <div class="col-md-6">
                    <label for="brand" class="form-label">Product Category:</label>
                     <select class="form-select" id = "prodCategory" th:field="*{prodSubCategory.productCategory}" required>
                        <option value="" selected>Select Category</option>
                        <option th:each="category : ${prodCategory}" th:value="${category.id}" th:text="${category.name}"></option>
                    </select>
                </div>
            </div>
            <div class="d-flex justify-content-center">
                <button type="submit" th:onclick="'saveProductSubCategory(' + (${prodSubCategory.id} != null ? 'true' : 'false') + ');'" class="btn btn-primary">Save</button>
            </div>
    </div>
</body>
</html>
