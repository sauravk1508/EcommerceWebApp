<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>Admin - Categories List</title>
    <script src="/dwr/engine.js"></script>
    <script src="/dwr/util.js"></script>
    <script src="/dwr/interface/adminController.js"></script>
    <script th:src="@{/js/productCategory.js}"></script>
</head>
<body>
	<div th:insert="~{allcss.html}"></div>
	<div class="container mt-5">
		<h2 class="text-center"> All Categories</h2>
		<table class="table table-striped table-hover">
		  <thead>
		    <tr>
		      <th scope="col">#</th>
		      <th scope="col">Category Name</th>
		      <th scope="col">Description</th>
		      <th scope="col">Action</th>
		    </tr>
		  </thead>
		  <tbody>
		    <tr th:each="category, iterStat : ${prodCategoryList}" th:value="${category.id}">
		      <th scope="row" th:text="${iterStat.index + 1}"></th>
		      <td th:text="${category.name}"></td>
		      <td th:text="${category.description}"></td>
		      <td ><a th:href="@{/admin/products/editProdCategoryInput/{categoryId}(categoryId=${category.id})}" th:value="${category.id}" class="btn btn-info"><i class="fas fa-edit"></i> Edit</a>
		      	<button id="deleteCategory" onClick="deleteCategory(this);" class="btn btn-danger" th:value="${category.id}"><i class="fa-solid fa-trash"></i> Delete</button>
		      </td>
		    </tr>
		  </tbody>
		</table>
	</div>
</body>
</html>
