<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <meta name="description" content="" />
    <meta name="author" content="" />
    <title>Admin - Product View</title>
    <link rel="stylesheet" th:href="@{/css/viewProduct.css}" />
    <div th:insert="~{allcss.html}"></div>
   
</head>
<body>
    <div th:insert="~{navbar.html}"></div>

    <div class="container fade-in">
        <div class="row">
            <!-- Product Image Section -->
            <div class="col-md-6 col-sm-12 mb-4 text-center">
               <img th:src="@{${product.imagePath}}" 
                     alt="Product Image" class="card-img-top img-fluid" />
            </div>

            <!-- Product Details Section -->
            <div class="col-md-6 col-sm-12 product-details">
                <h3 th:text="${product.name}"></h3>
                <p>Description: <strong th:text="${product.description}"></strong></p>
                <p>Brand: <strong th:text="${product.brand}"></strong></p>
                <p>Price: <strong th:text="${product.price}"></strong></p>
                <p>Launch Date: <strong th:text="${product.releaseDate}"></strong></p>
                <p>Category: <strong th:text="${product.category}"></strong></p>
                <p>Availability: <strong th:text="${product.available ? 'Available' : 'Out of Stock'}"></strong></p>
                <p th:if="${product.available}">
                    Quantity in Stock: <strong th:text="${product.quantity}"></strong>
                </p>

                <!-- Buy Button -->
                <a href="#" class="btn btn-primary btn-lg mt-3">Buy Now</a>
                <a th:href="@{/admin/products}" class="btn btn-secondary btn-lg mt-3">Back to Products</a>

                <!-- Add to Cart Form -->
                <form th:action="@{/cart/view}" method="post" class="mt-3">
                    <input type="hidden" name="productId" th:value="${product.id}" />
                    <div class="input-group">
                        <input type="number" name="quantity" min="1" value="1" class="form-control" />
                        <button type="submit">Add to Cart</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
