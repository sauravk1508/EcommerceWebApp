spring.application.name=EcommerceWebApp

spring.datasource.url= jdbc:mysql://localhost:3307/springBoot
spring.datasource.username = root
spring.datasource.password = 12345



# Dialect to use for your database (replace with your specific dialect)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Hibernate logging to check SQL queries
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE 

# Enable SQL query logging
spring.jpa.show-sql=true

# Format the SQL queries to make them easier to read
spring.jpa.properties.hibernate.format_sql=true
logging.level.org.springframework.security=DEBUG

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML 
# Server configuration
server.port=8081

# Multipart configuration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB 
# Max request size for file uploads






